<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEEN CHEATS - Galary</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --topbar-bg: rgba(11, 15, 25, 0.85);
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-hover: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: scroll;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4); 
        }

        /* Animations */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideInDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Topbar / Sticky Header */
        .topbar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--topbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            animation: slideInDown 0.6s ease-out;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        /* Tabs in Topbar */
        .tabs {
            display: flex;
            gap: 0.8rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.3);
            color: var(--accent-hover);
        }

        /* Search in Topbar */
        .search-bar {
            position: relative;
            width: 250px;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-bar svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.3);
            width: 280px; /* expands slightly */
        }

        /* Gallery Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: fadeInScale 0.5s ease-out backwards;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 20px rgba(14, 165, 233, 0.4);
            z-index: 10;
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            background: rgba(0,0,0,0.3);
            position: relative;
        }
        
        .tab-banner .card-img-wrapper {
            aspect-ratio: 16/7;
            padding: 0;
        }

        .card img, .card video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }
        
        .tab-banner .card img, .tab-banner .card video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        
        .card:hover img, .card:hover video {
            transform: scale(1.1);
        }

        .card-info {
            padding: 0.8rem;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .item-id {
            font-size: 0.8rem;
            font-family: monospace;
            color: #e2e8f0;
            word-break: break-all;
            font-weight: 600;
        }

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 20px;
            max-width: 90%;
            width: 550px;
            text-align: center;
            position: relative;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .modal.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .close-btn:hover {
            color: #ef4444;
        }

        .modal img, .modal video {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-id {
            font-size: 1.3rem;
            font-family: monospace;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .modal-api-link {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            word-break: break-all;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px dashed var(--border);
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 4000;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .loading {
            grid-column: 1/-1; 
            text-align: center; 
            padding: 4rem;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .search-bar, .search-bar input:focus {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Top Navigation -->
    <nav class="topbar">
        <div class="logo">QUEEN CHEATS</div>
        
        <div class="tabs" id="tabsContainer">
            <!-- Tabs generated by JS -->
        </div>

        <div class="search-bar">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search by ID..." onkeyup="filterItems()">
        </div>
    </nav>

    <!-- Gallery Container -->
    <div class="container">
        <div class="grid" id="assetGrid">
            <div class="loading" id="loadingText">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 2s linear infinite; margin-bottom: 1rem; display: block; margin: 0 auto;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10"></path>
                </svg>
                <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
                Fetching assets from Server...
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal(event, true)">&times;</span>
            <div id="modal-media-container"></div>
            <div class="modal-id" id="modal-id"></div>
            <div class="modal-api-link" id="modal-api-link"></div>
            
            <div class="action-btns">
                <button class="btn btn-primary" onclick="copyApiLink()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy API Link
                </button>
                <button class="btn" onclick="openUrl()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    View Raw
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Link Copied!
    </div>

    <script>
        // ==========================================
        // GITHUB API SETTINGS
        // ==========================================
        const githubUser = "QUEEN-CHEATS"; 
        const githubRepo = "ICONS";       
        
        const folders = ["banner", "character", "icons", "qnc"];
        let db = {};
        let currentTab = "banner";
        let currentModalId = "";
        let currentModalFile = "";
        let currentModalFolder = "";

        // Start loading
        window.onload = loadDataFromGitHub;

        // ==========================================
        // FETCH DATA FROM GITHUB API
        // ==========================================
        async function loadDataFromGitHub() {
            try {
                // Fetch all folders simultaneously
                const promises = folders.map(folder => 
                    fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${folder}`)
                        .then(res => {
                            if (!res.ok) return []; 
                            return res.json();
                        })
                        .then(data => {
                            if(Array.isArray(data)) {
                                return data.filter(item => item.type === "file").map(item => item.name);
                            }
                            return [];
                        })
                        .catch(() => []) 
                );
                
                const results = await Promise.all(promises);
                
                folders.forEach((folder, index) => {
                    db[folder] = results[index];
                });

                initTabs();
                switchTab('banner');
            } catch (err) {
                console.error("GitHub API fetch failed", err);
                document.getElementById('assetGrid').innerHTML = `
                    <div class="loading" style="color: #ef4444;">
                        Failed to load data from QNC Server.<br>
                        Please wait for QNC Server become public.
                    </div>`;
            }
        }

        // ==========================================
        // UI LOGIC
        // ==========================================
        function initTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            const labels = {
                'banner': 'Banners',
                'character': 'Characters',
                'icons': 'Icons',
                'qnc': 'QNC Media'
            };
            
            folders.forEach(tab => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${tab === currentTab ? 'active' : ''}`;
                btn.innerText = `${labels[tab] || tab} (${db[tab].length})`;
                btn.onclick = () => switchTab(tab);
                container.appendChild(btn);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase().startsWith(tab.toLowerCase()) || 
                  (tab==='qnc' && btn.innerText.startsWith('QNC'))) btn.classList.add('active');
            });
            
            const grid = document.getElementById('assetGrid');
            grid.className = `grid tab-${tab}`;
            
            document.getElementById('searchInput').value = "";
            renderGrid(db[tab]);
        }
        
        function isVideo(filename) {
            const ext = filename.toLowerCase();
            return ext.endsWith('.mp4') || ext.endsWith('.webm') || ext.endsWith('.mov');
        }

        function renderGrid(items) {
            const grid = document.getElementById('assetGrid');
            grid.innerHTML = '';
            
            const folder = currentTab;
            
            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="loading">No assets found in <b>${folder}</b> folder.</div>`;
                return;
            }
            
            items.forEach((file, index) => {
                // ID is filename without extension
                const id = file.split('.').slice(0, -1).join('.') || file;
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(index % 20) * 0.03}s`;
                card.onclick = () => openModal(id, file, folder);
                
                let mediaHtml = '';
                if(isVideo(file)) {
                    mediaHtml = `<video src="${folder}/${file}" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>`;
                } else {
                    mediaHtml = `<img src="${folder}/${file}" alt="${id}" loading="lazy">`;
                }
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        ${mediaHtml}
                    </div>
                    <div class="card-info">
                        <span class="item-id">${id}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const items = db[currentTab] || [];
            const filtered = items.filter(b => b.toLowerCase().includes(search));
            renderGrid(filtered);
        }

        // ==========================================
        // MODAL & COPY LOGIC
        // ==========================================
        function getDirectUrl(folder, file) {
            // Using absolute URL to ensure CDN is used
            const baseUrl = window.location.origin;
            const pathname = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            return `${baseUrl}${pathname}/${folder}/${file}`;
        }

        function openModal(id, file, folder) {
            currentModalId = id;
            currentModalFile = file;
            currentModalFolder = folder;
            
            const directUrl = getDirectUrl(folder, file);
            
            const container = document.getElementById('modal-media-container');
            if(isVideo(file)) {
                container.innerHTML = `<video src="${directUrl}" controls autoplay></video>`;
            } else {
                container.innerHTML = `<img src="${directUrl}" alt="Preview">`;
            }
            
            document.getElementById('modal-id').innerText = file;
            document.getElementById('modal-api-link').innerText = directUrl;
            
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal(e, force=false) {
            if (force || e.target.id === 'modal') {
                const modal = document.getElementById('modal');
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                    // pause video if any
                    const v = document.querySelector('#modal-media-container video');
                    if(v) v.pause();
                }, 300);
            }
        }

        function copyApiLink() {
            const directUrl = getDirectUrl(currentModalFolder, currentModalFile);
            navigator.clipboard.writeText(directUrl).then(() => {
                showToast(`Direct link copied!`);
            });
        }
        
        function openUrl() {
            const directUrl = getDirectUrl(currentModalFolder, currentModalFile);
            window.open(directUrl, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

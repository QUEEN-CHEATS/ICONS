<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Assets API</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-hover: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideInDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Viewer Mode */
        body.viewer-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }
        
        .viewer-image {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        /* Gallery */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: slideInDown 0.6s ease-out;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: slideInDown 0.8s ease-out;
        }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(14, 165, 233, 0.1);
            border-color: var(--accent);
            color: var(--accent-hover);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
        }

        /* Search */
        .search-bar {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem auto;
            animation: slideInDown 1s ease-out;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.3);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: fadeInScale 0.5s ease-out backwards;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.05);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px rgba(14, 165, 233, 0.3);
            z-index: 10;
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1; /* Square for icons/characters */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            background: rgba(0,0,0,0.2);
        }
        
        .tab-Banners .card-img-wrapper {
            aspect-ratio: 16/7; /* Rectangular for banners */
            padding: 0;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .tab-Banners .card img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 0.8rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .item-id {
            font-size: 0.75rem;
            font-family: monospace;
            color: #e2e8f0;
            word-break: break-all;
        }

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 16px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        .modal img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .modal-id {
            font-size: 1.2rem;
            font-family: monospace;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 3000;
            font-weight: 600;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Viewer Mode -->
    <div id="viewer" style="display: none;">
        <img id="viewer-img" class="viewer-image" src="" alt="Asset" onerror="this.src='banner/900000014.png'">
    </div>

    <!-- Gallery -->
    <div id="gallery" class="container" style="display: none;">
        <header>
            <h1>FF Assets API</h1>
            <p class="desc">Banners, Characters, and Icons</p>
        </header>

        <div class="tabs" id="tabsContainer">
            <!-- Tabs generated by JS -->
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by ID..." onkeyup="filterItems()">
        </div>

        <div class="grid" id="assetGrid">
            <!-- Dynamic Content -->
        </div>
    </div>
    
    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal(event, true)">&times;</span>
            <img id="modal-img" src="" alt="Preview">
            <div class="modal-id" id="modal-id">123456</div>
            <div class="action-btns">
                <button class="btn btn-primary" onclick="copyId()">Copy ID</button>
                <button class="btn" onclick="openUrl()">View Raw</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">ID Copied!</div>

        const folders = {"Banners": "banner", "Characters": "character", "Icons": "icons"};
        
        let currentTab = "Banners";
        let currentModalId = "";
        let currentModalFolder = "";
        
        const urlParams = new URLSearchParams(window.location.search);
        // Viewer logic: check ?banner= id, ?character= id, ?icon= id, or ?id= (defaults to banner)
        let requestedId = null;
        let requestedFolder = "";
        
        if(urlParams.get('banner') || urlParams.get('id')) {
            requestedId = urlParams.get('banner') || urlParams.get('id');
            requestedFolder = "banner";
        } else if (urlParams.get('character')) {
            requestedId = urlParams.get('character');
            requestedFolder = "character";
        } else if (urlParams.get('icon')) {
            requestedId = urlParams.get('icon');
            requestedFolder = "icons";
        }
        
        if (requestedId) {
            document.body.classList.add('viewer-mode');
            document.getElementById('viewer').style.display = 'block';
            if (!requestedId.endsWith('.png') && !requestedId.endsWith('.jpg')) {
                requestedId += '.png'; // assuming png as default fallback
            }
            document.getElementById('viewer-img').src = requestedFolder + '/' + requestedId;
        } else {
            document.getElementById('gallery').style.display = 'block';
            initTabs();
            renderGrid(db[currentTab]);
        }

        function initTabs() {
            const container = document.getElementById('tabsContainer');
            Object.keys(db).forEach(tab => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${tab === currentTab ? 'active' : ''}`;
                btn.innerText = `${tab} (${db[tab].length})`;
                btn.onclick = () => switchTab(tab);
                container.appendChild(btn);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.startsWith(tab)) btn.classList.add('active');
            });
            
            const grid = document.getElementById('assetGrid');
            grid.className = `grid tab-${tab}`; // For conditional styling
            
            document.getElementById('searchInput').value = "";
            renderGrid(db[tab]);
        }

        function renderGrid(items) {
            const grid = document.getElementById('assetGrid');
            grid.innerHTML = '';
            
            const folder = folders[currentTab];
            
            items.forEach((file, index) => {
                const id = file.split('.')[0]; // remove extension
                const card = document.createElement('div');
                card.className = 'card';
                // stagger animation delay
                card.style.animationDelay = `${(index % 20) * 0.05}s`;
                card.onclick = () => openModal(id, file, folder);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${folder}/${file}" alt="${id}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <span class="item-id">${id}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const items = db[currentTab];
            const filtered = items.filter(b => b.toLowerCase().includes(search));
            renderGrid(filtered);
        }

        function openModal(id, file, folder) {
            currentModalId = id;
            currentModalFolder = folder;
            
            document.getElementById('modal-img').src = `${folder}/${file}`;
            document.getElementById('modal-id').innerText = id;
            
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            // small delay to trigger transition
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal(e, force=false) {
            if (force || e.target.id === 'modal') {
                const modal = document.getElementById('modal');
                modal.classList.remove('show');
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function copyId() {
            navigator.clipboard.writeText(currentModalId).then(() => {
                showToast(`ID ${currentModalId} Copied!`);
            });
        }
        
        function openUrl() {
            const baseUrl = window.location.href.split('?')[0];
            let param = "id";
            if(currentTab === "Characters") param = "character";
            if(currentTab === "Icons") param = "icon";
            
            const fullUrl = `${baseUrl}?${param}=${currentModalId}`;
            window.open(fullUrl, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
